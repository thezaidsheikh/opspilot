
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "opspilot"
version = "0.1.0"
description = "AI Incident Investigation and Remediation Platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []


[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "pyright>=1.1,<2",
]


[tool.setuptools]
package-dir = {"" = "apps/api/src"}


[tool.setuptools.packages.find]
where = ["apps/api/src"]
include = ["opspilot*"]


[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = ["E501"]


[tool.ruff.lint.isort]
known-first-party = ["opspilot"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
